name: Feature request
description: Propose a focused improvement to Pier.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and pull requests before proposing a feature.
        Explain how this fits Pier's local proxy and orchestration scope.
        **Do not post secrets, tunnel credentials, private keys, private tailnet information, or sensitive network names.**
        Sanitize configuration, logs, command output, and screenshots; replace private hostnames and addresses with placeholders.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and who would benefit from this improvement?
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior or workflow
      description: Describe the steps and commands you use today, the exposure path involved, and the limitation you encounter. If this is a new workflow, say so.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Desired behavior
      description: Describe the expected result and a concrete example that would show the feature works.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach and alternatives
      description: Suggest a command, configuration, or behavior if you have one. Include alternatives or workarounds considered and any effect on public exposure, route ownership, or cleanup.
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: If based on an existing setup, include OS version and architecture, Pier version or commit (pier --version or git rev-parse HEAD), and tailscale version or cloudflared --version where relevant. Omit private network details.
      placeholder: |
        OS and architecture:
        Pier version or commit:
        Backend and version (if relevant):
  - type: textarea
    id: config
    attributes:
      label: Sanitized pier.yaml example
      description: Include a minimal current or proposed config if useful, and say which it is in your proposal. Remove secrets, tunnel credentials, and private network details.
      render: yaml
  - type: textarea
    id: validation
    attributes:
      label: Validation performed
      description: List any checks, experiments, or workarounds actually tried and their results. Write "Not run" if none. Live backend access is not required to propose a feature.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets, tunnel credentials, private tailnet information, and sensitive network names from this request and any attachments.
          required: true
