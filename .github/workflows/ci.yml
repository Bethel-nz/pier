name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        run: |
          gofmt -w .
          test -z "$(git diff --name-only)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
