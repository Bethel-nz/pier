name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        # Windows checkouts may convert line endings, which gofmt would report.
        if: runner.os == 'Linux'
        run: |
          gofmt -w .
          test -z "$(git diff --name-only)"
      - name: vet
        run: go vet ./... && go vet -tags e2e ./e2e/
      - name: test
        run: go test ./...
      - name: installer
        if: runner.os != 'Windows'
        run: bash scripts/install_test.sh
      - name: installer (parse)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: end to end
        # The real binary: pier up runs an app and serves it, then Ctrl-C,
        # pier down, and pier clean must leave nothing running.
        run: go test -tags e2e -v -count=1 -timeout 5m ./e2e/
