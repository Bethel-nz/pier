name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "Refusing to publish '$tag'. The tag must start with v." >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build_unix() {
            local os="$1"
            local arch="$2"
            local directory="dist/pier_${os}_${arch}"
            mkdir -p "$directory"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$directory/pier" ./cmd/pier
            tar -czf "dist/pier_${os}_${arch}.tar.gz" -C "$directory" pier
          }

          build_windows() {
            local arch="$1"
            local directory="dist/pier_windows_${arch}"
            mkdir -p "$directory"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$directory/pier.exe" ./cmd/pier
            (cd "$directory" && zip -q "../pier_windows_${arch}.zip" pier.exe)
          }

          build_unix darwin amd64
          build_unix darwin arm64
          build_unix linux amd64
          build_unix linux arm64
          build_windows amd64
          build_windows arm64

          cd dist
          sha256sum pier_*.tar.gz pier_*.zip > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/pier_*.tar.gz \
              dist/pier_*.zip \
              dist/checksums.txt \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/pier_*.tar.gz \
              dist/pier_*.zip \
              dist/checksums.txt \
              --verify-tag \
              --generate-notes \
              --title "Pier ${RELEASE_TAG}"
          fi
