version: 1
name: greppa

defaults:
  public: false
  protocol: http

services:
  web:
    target: localhost:3000
    path: /
    local: myapp.local

  api:
    target: localhost:4000
    path: /api
    # Optional: pier up starts this and restarts it when a .go file changes.
    run: go run ./cmd/api
    watch: ["**/*.go"]

  webhook:
    target: localhost:8787
    path: /hooks
    public: true
